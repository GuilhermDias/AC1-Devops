name: CI

# Roda em todo push (qualquer branch) e em todo Pull Request para a main. O job 'build' executa
# o 'mvn verify' completo: testes unitarios, de integracao (H2), regras de arquitetura (ArchUnit)
# e o piso de cobertura do JaCoCo. Se qualquer um falhar, o check do PR fica vermelho.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, testes, ArchUnit e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 21 (versao do pom.xml)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + testes + ArchUnit + jacoco:check
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Publicar relatorio JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Publicar relatorios de teste (Surefire)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  # Job separado: o servico de IA tem ciclo proprio, e uma falha aqui nao se confunde com o build do Core.
  ia-service:
    name: Servico de IA (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: labs/desafio-3/ia-service

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python 3.14 (versao do Dockerfile)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: labs/desafio-3/ia-service/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Testes pytest
        run: pytest -v

      - name: Build da imagem Docker
        run: docker build -t ia-service .

  simulador-iot:
    name: Simulador de dispositivo (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: labs/desafio-5/simulador

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: labs/desafio-5/simulador/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Testes pytest
        run: pytest -v
