# Perfil 'postgres' — banco rodando em container (servico 'postgres' do docker-compose).
# Os defaults apontam para localhost para permitir rodar a app fora do Docker contra o
# container de banco publicado na porta 5432; dentro da rede do compose as variaveis de
# ambiente sobrescrevem o host para 'postgres'.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ac1devops_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
