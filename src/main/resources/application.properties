spring.application.name=AC1-DevOps

# Perfil padrao: postgres (container Docker). Sobrescrito por SPRING_PROFILES_ACTIVE
# no docker-compose, e trocavel por 'h2' para rodar localmente sem Docker.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

# Hibernate cria/atualiza o schema a partir das entities JPA (nao ha migracao versionada
# neste escopo). Em producao real isso daria lugar a Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
# Desligado: a varredura da outbox consulta o banco a cada poucos segundos e tomaria o log.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# O StudentService monta os DTOs lendo a colecao lazy de level-ups fora de transacao;
# manter open-in-view ligado (valor padrao) explicita essa dependencia e silencia o WARN.
spring.jpa.open-in-view=true

springdoc.swagger-ui.path=/swagger-ui.html

# Observabilidade (ADR-006): so o necessario exposto, com histograma para calcular o p95 no Prometheus.
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
