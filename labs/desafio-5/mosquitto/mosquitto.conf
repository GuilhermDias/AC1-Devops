# Broker do laboratorio. Sem autenticacao nem TLS: em producao, exigir os dois (ver ADR-005).
listener 1883
allow_anonymous true

# Guarda sessoes e mensagens QoS 1 em disco, para sobreviverem a um reinicio do broker.
persistence true
persistence_location /mosquitto/data/

# Quantas mensagens o broker guarda por cliente desconectado. Acima disso, as novas sao descartadas.
max_queued_messages 10000

# Um evento tem cerca de 200 bytes: recusa o que foge muito disso.
message_size_limit 4096
